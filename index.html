<script type="module">
import * as THREE from 'three';

/* ========== Telegram ========== */
let TG=null;
function initTG(){const tg=window.Telegram?.WebApp;if(!tg||TG)return;try{tg.ready();tg.expand();tg.setHeaderColor?.('#0a1628');tg.setBackgroundColor?.('#0a1628');tg.disableVerticalSwipes?.();TG=tg;}catch(e){}}
try{initTG();if(!TG){const s=document.createElement('script');s.src='https://telegram.org/js/telegram-web-app.js';s.onload=initTG;document.head.appendChild(s);}}catch(e){}
function haptic(kind){try{if(TG?.HapticFeedback){if(kind==='win')TG.HapticFeedback.notificationOccurred('success');else if(kind==='lose')TG.HapticFeedback.notificationOccurred('error');else TG.HapticFeedback.impactOccurred(kind||'light');}else if(navigator.vibrate){navigator.vibrate(kind==='win'?[30,40,60]:kind==='lose'?120:12);}}catch(e){}}

/* ========== Storage / Sound ========== */
const load=(k,d)=>{try{const v=localStorage.getItem('ch3_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}};
const save=(k,v)=>{try{localStorage.setItem('ch3_'+k,JSON.stringify(v));}catch(e){}};
let actx=null,muted=load('muted',false),masterGain=null;
function ensureAudio(){
  if(muted)return null;
  try{
    actx=actx||new(window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    if(!masterGain){masterGain=actx.createGain();masterGain.gain.value=0.9;masterGain.connect(actx.destination);}
    return actx;
  }catch(e){return null;}
}
function beep(freq,dur,type='sine',vol=0.08,slide){
  const ctx=ensureAudio();if(!ctx)return;
  try{
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,ctx.currentTime);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),ctx.currentTime+dur);
    g.gain.setValueAtTime(vol,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+dur);
    o.connect(g);g.connect(masterGain||ctx.destination);o.start();o.stop(ctx.currentTime+dur);
  }catch(e){}
}
function noiseBurst(dur=0.08,vol=0.04,freq=800){
  const ctx=ensureAudio();if(!ctx)return;
  try{
    const n=ctx.createBufferSource(),buf=ctx.createBuffer(1,ctx.sampleRate*dur,ctx.sampleRate);
    const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.5);
    n.buffer=buf;
    const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=1.2;
    const g=ctx.createGain();g.gain.setValueAtTime(vol,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+dur);
    n.connect(f);f.connect(g);g.connect(masterGain||ctx.destination);n.start();
  }catch(e){}
}

const BIOMES=[

const bodyGeo=new THREE.SphereGeometry(0.14,10,8);

function buildEnvironment(biome){
  while(world.children.length)world.remove(world.children[0]);
  scene.background=new THREE.Color(biome.sky);
  scene.fog=new THREE.Fog(biome.fog,biome.fogNear,biome.fogFar);
  spawnAmbient(biome);

  // Long continuous road (covers full level + 100-step stairs)
  const ROAD_LEN=500;
  const roadMat=new THREE.MeshStandardMaterial({color:biome.road,roughness:0.7,metalness:0.05});
  const road=new THREE.Mesh(new THREE.PlaneGeometry(ROAD_W,ROAD_LEN),roadMat);
  road.rotation.x=-Math.PI/2;road.position.z=-ROAD_LEN/2+10;road.receiveShadow=true;world.add(road);

  // Chevron arrows on road
  const chevMat=new THREE.MeshBasicMaterial({color:biome.roadLine,transparent:true,opacity:0.35});
  for(let i=0;i<90;i++){
    const chev=new THREE.Mesh(new THREE.PlaneGeometry(1.8,0.9),chevMat);
    chev.rotation.x=-Math.PI/2;chev.position.set(0,0.015,-i*5.5);

/* ========== Челик — concept art style (big head, soft body, eyes forward) ========== */
function makeCharacter(bodyColor, headColor, scale=1){
  const g=new THREE.Group();
  // Soft clay material
  const mat=new THREE.MeshStandardMaterial({color:bodyColor, roughness:0.35, metalness:0.05});
  const eyeMat=new THREE.MeshStandardMaterial({color:0x0f172a, roughness:0.25});

  // Chubby body
  const body=new THREE.Mesh(new THREE.SphereGeometry(0.16,12,10), mat);
  body.position.y=0.18*scale;
  body.scale.set(1.15*scale, 1.0*scale, 0.95*scale);
  body.castShadow=true; g.add(body);

  // Large head (dominant like concept)
  const headMat=new THREE.MeshStandardMaterial({color:bodyColor, roughness:0.32});
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.17,12,10), headMat);
  head.position.y=0.40*scale;
  head.scale.set(1.05*scale, 1.05*scale, 1.0*scale);
  head.castShadow=true; g.add(head);

  // Eyes on FRONT of face: characters run toward -Z, so eyes at -Z
  const eyeL=new THREE.Mesh(new THREE.SphereGeometry(0.035,8,6), eyeMat);
  eyeL.position.set(-0.05*scale, 0.42*scale, -0.14*scale);
  eyeL.scale.set(0.85*scale, 1.15*scale, 0.7*scale); g.add(eyeL);
  const eyeR=new THREE.Mesh(new THREE.SphereGeometry(0.035,8,6), eyeMat);
  eyeR.position.set(0.05*scale, 0.42*scale, -0.14*scale);
  eyeR.scale.set(0.85*scale, 1.15*scale, 0.7*scale); g.add(eyeR);

  // Stubby arms (concept pose)
  const armL=new THREE.Mesh(new THREE.SphereGeometry(0.055,8,6), mat);
  armL.position.set(-0.18*scale, 0.20*scale, -0.02*scale);
  armL.scale.set(scale, scale*1.1, scale); g.add(armL);
  const armR=new THREE.Mesh(new THREE.SphereGeometry(0.055,8,6), mat);
  armR.position.set(0.18*scale, 0.20*scale, -0.02*scale);
  armR.scale.set(scale, scale*1.1, scale); g.add(armR);

  // Legs / feet
  const legL=new THREE.Mesh(new THREE.SphereGeometry(0.055,8,6), mat);
  legL.position.set(-0.06*scale, 0.05*scale, -0.02*scale);
  legL.scale.set(scale, scale*0.9, scale*1.15); g.add(legL);
  const legR=new THREE.Mesh(new THREE.SphereGeometry(0.055,8,6), mat);
  legR.position.set(0.06*scale, 0.05*scale, -0.02*scale);
  legR.scale.set(scale, scale*0.9, scale*1.15); g.add(legR);

  g.userData={
    bodyMat:mat, headMat, limbMat:mat,
    armL, armR, legL, legR,
    phase: Math.random()*Math.PI*2,
    scale,
    appear: 1, targetAppear: 1,
    tx:0, tz:0,
  };
  return g;
}

/* ========== Splat particles (battle death effect) ========== */
const splatPool=[];
function spawnSplat(x, y, z, color, n=6){
  for(let i=0;i<n;i++){
    const m=new THREE.Mesh(
      new THREE.SphereGeometry(0.04+Math.random()*0.06, 5, 4),
      new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.9})
    );
    m.position.set(x+(Math.random()-0.5)*0.3, y+0.1, z+(Math.random()-0.5)*0.3);
    m.userData={
      vx:(Math.random()-0.5)*3, vy:1+Math.random()*3, vz:(Math.random()-0.5)*3,
      life:0.4+Math.random()*0.4
    };
    scene.add(m);
    splatPool.push(m);
  }
}
function updateSplat(dt){
  for(let i=splatPool.length-1;i>=0;i--){
    const m=splatPool[i]; const u=m.userData;
    u.life-=dt; u.vy-=12*dt;
    m.position.x+=u.vx*dt; m.position.y+=u.vy*dt; m.position.z+=u.vz*dt;
    m.material.opacity=Math.max(0, u.life*2);
    if(u.life<=0 || m.position.y<-0.5){ scene.remove(m); splatPool.splice(i,1); }
  }
}

/* ========== Crowd — physics like reference ========== */
class Crowd{
  constructor(isPlayer=true){
    this.group=new THREE.Group();
    this.chars=[];
    this.count=0;       // logical count
    this.displayN=0;    // smoothly approaches count
    this.isPlayer=isPlayer;
    this.x=0; this.targetX=0;
    this.color=isPlayer ? 0x3b9eff : 0xe67e22;
    scene.add(this.group);
  }
  setColors(body, head){
    this.color=body;
    for(const c of this.chars){
      c.userData.bodyMat.color.setHex(body);
      c.userData.headMat.color.setHex(body);
      c.userData.limbMat.color.setHex(body);
    }
  }
  // Request a new count — characters animate in/out
  setCount(n, instant=false){
    n=Math.max(0, Math.min(150, Math.floor(n)));
    const prev=this.count;
    this.count=n;
    if(instant){ this._syncChars(n); this.displayN=n; this.layout(true); return; }

    // Growing: add chars at edge, shrink: mark outer ones for despawn
    if(n > this.chars.length){
      const pal=this.isPlayer ? getPalette() : {body:0xe67e22, head:0xf5a26f};
      while(this.chars.length < n){
        const ch=makeCharacter(pal.body, pal.head, 1);
        ch.userData.appear=0; ch.userData.targetAppear=1;
        // spawn outside and pull in
        const a=Math.random()*Math.PI*2;
        ch.position.set(Math.cos(a)*1.5, 0, Math.sin(a)*1.5);
        this.chars.push(ch); this.group.add(ch);
      }
    } else if(n < this.chars.length){
      // Mark extras for despawn (from end of array = outer)
      for(let i=n; i<this.chars.length; i++){
        this.chars[i].userData.targetAppear=0;
      }
    }
    this.layout(false);
  }
  _syncChars(n){
    const pal=this.isPlayer ? getPalette() : {body:0xe67e22, head:0xf5a26f};
    while(this.chars.length < n){
      const ch=makeCharacter(pal.body, pal.head, 1);
      this.chars.push(ch); this.group.add(ch);
    }
    while(this.chars.length > n){
      const ch=this.chars.pop(); this.group.remove(ch);
    }
  }
  layout(instant=false){
    // Fibonacci spiral dense packing
    const n=this.chars.length;
    for(let i=0;i<n;i++){
      const r=0.18*Math.sqrt(i+0.25);
      const a=i*2.39996323;
      const ch=this.chars[i];
      ch.userData.tx=Math.cos(a)*r;
      ch.userData.tz=Math.sin(a)*r*0.92;
      if(instant){
        ch.position.x=ch.userData.tx;
        ch.position.z=ch.userData.tz;
      }
      ch.userData.phase=i*1.3;
    }
  }
  // Remove fully disappeared chars + splat
  _cleanup(){
    for(let i=this.chars.length-1;i>=0;i--){
      const ch=this.chars[i];
      if(ch.userData.targetAppear<=0 && ch.userData.appear<=0.02){
        // splat at world position
        const wp=new THREE.Vector3();
        ch.getWorldPosition(wp);
        spawnSplat(wp.x, wp.y, wp.z, this.color, 5);
        this.group.remove(ch);
        this.chars.splice(i,1);
      }
    }
  }
  update(dt, t){
    // Steer
    this.x+=(this.targetX-this.x)*Math.min(1, dt*9);
    this.group.position.x=this.x;

    // Smooth display count
    this.displayN+=(this.count-this.displayN)*Math.min(1, dt*8);

    // Animate each character toward layout + appear scale + run cycle
    for(const ch of this.chars){
      // Move toward formation slot
      ch.position.x+=(ch.userData.tx-ch.position.x)*Math.min(1, dt*8);
      ch.position.z+=(ch.userData.tz-ch.position.z)*Math.min(1, dt*8);

      // Appear / disappear
      ch.userData.appear+=(ch.userData.targetAppear-ch.userData.appear)*Math.min(1, dt*10);
      const s=Math.max(0.01, ch.userData.appear);

      // Smooth run: bounce + limb swing facing -Z (forward)
      const ph=t*16+ch.userData.phase;
      const bob=Math.abs(Math.sin(ph))*0.04;
      const squash=1+Math.sin(ph*2)*0.04;
      ch.position.y=bob;
      ch.scale.set(s*squash, s*(2-squash), s*squash);
      ch.rotation.set(0, 0, 0); // face -Z (eyes already on -Z)
      if(ch.userData.armL){
        const swing=Math.sin(ph)*0.08;
        const sc=ch.userData.scale;
        ch.userData.armL.position.y=0.20*sc+swing;
        ch.userData.armR.position.y=0.20*sc-swing;
        ch.userData.legL.position.y=0.05*sc-Math.abs(swing)*0.4;
        ch.userData.legR.position.y=0.05*sc-Math.abs(-swing)*0.4;
        ch.userData.legL.position.z=-0.02+Math.sin(ph)*0.04;
        ch.userData.legR.position.z=-0.02-Math.sin(ph)*0.04;
      }
    }
    this._cleanup();
  }
  dispose(){ scene.remove(this.group); this.chars=[]; }
}

const itemGroup=new THREE.Group();scene.add(itemGroup);

function makeLabelSprite(text,bgColor,w=128,h=64){
  const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext('2d');
  // Always draw readable background
  const bg=bgColor||'rgba(10,20,40,0.88)';
  ctx.fillStyle=bg;
  ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(4,4,w-8,h-8,14);else ctx.rect(4,4,w-8,h-8);
  ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.35)';
  ctx.lineWidth=3;
  ctx.stroke();
  ctx.fillStyle='#fff';
  ctx.font='bold '+(h>50?42:32)+'px Arial,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor='rgba(0,0,0,0.6)';ctx.shadowBlur=4;
  ctx.fillText(text,w/2,h/2+2);
  const tex=new THREE.CanvasTexture(canvas);
  return new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));
}

function makeGate(opLeft,opRight){
  const g=new THREE.Group();
  const hh=1.15, ww=ROAD_W/2-0.2, thick=0.55;
  const postMat=new THREE.MeshStandardMaterial({color:0x3d4a5c,roughness:0.4,metalness:0.35});
  const panels=[];
  function panel(op,x){
    const good=op.op==='+'||op.op==='×';
    const col=good?0x5ec8ff:0xff7b7b;
    const mat=new THREE.MeshStandardMaterial({
      color:col, roughness:0.12, metalness:0.25,
      transparent:true, opacity:0.5, depthWrite:false,
      emissive:col, emissiveIntensity:0.35
    });
    const mesh=new THREE.Mesh(new THREE.BoxGeometry(ww-0.25,hh,thick),mat);
    mesh.position.set(x,hh/2,0);g.add(mesh);panels.push(mesh);
    // Soft glow rim
    const rim=new THREE.Mesh(
      new THREE.BoxGeometry(ww-0.15,hh+0.08,0.08),
      new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0.4})
    );
    rim.position.set(x,hh/2,thick/2+0.02);g.add(rim);panels.push(rim);
    for(const sx of [x-(ww-0.25)/2, x+(ww-0.25)/2]){
      const post=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,hh+0.2,8),postMat);
      post.position.set(sx,(hh+0.2)/2,0);post.castShadow=true;g.add(post);
      // Post top sphere
      const cap=new THREE.Mesh(new THREE.SphereGeometry(0.12,8,6),
        new THREE.MeshStandardMaterial({color:0xfbbf24,metalness:0.5,emissive:0xfbbf24,emissiveIntensity:0.3}));
      cap.position.set(sx,hh+0.15,0);g.add(cap);
    }
    const spr=makeLabelSprite(op.op+op.v, good?'rgba(20,80,160,0.92)':'rgba(160,40,40,0.92)', 160, 80);
    spr.scale.set(1.9,0.95,1);
    spr.position.set(x,hh/2+0.15,thick/2+0.12);
    g.add(spr);
  }
  panel(opLeft,-ROAD_W/4);
  panel(opRight,ROAD_W/4);
  const mid=new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.11,hh+0.25,8),postMat);
  mid.position.y=(hh+0.25)/2;g.add(mid);
  g.userData.panels=panels;
  g.userData.pulse=true;
  return g;
}

function makeSaw(){

function makePower(kind){
  const g=new THREE.Group();
  const colors={magnet:0xa855f7,shield:0x38bdf8,x2:0xfbbf24,boost:0xf97316};

function makeEnemyCrowd(n,boss){
  const g=new THREE.Group();
  g.rotation.y=Math.PI; // face the approaching player
  // Orange/red like reference
  const bodyC=boss?0xc0392b:0xe67e22, headC=boss?0xe74c3c:0xf5a26f;
  const count=Math.min(n,80);
  // Circular platform under enemy (reference style)
  const platR=Math.max(0.8, 0.22*Math.sqrt(count+1)+0.3);
  const plat=new THREE.Mesh(
    new THREE.CylinderGeometry(platR,platR+0.1,0.08,24),
    new THREE.MeshStandardMaterial({color:boss?0xf5b7b1:0xfad7a0,roughness:0.6,transparent:true,opacity:0.7})
  );
  plat.position.y=0.04;g.add(plat);

  for(let i=0;i<count;i++){
    const ch=makeCharacter(bodyC,headC,1.0);
    const r=0.19*Math.sqrt(i+0.3);
    const a=i*2.39996323;
    ch.position.set(Math.cos(a)*r,0,Math.sin(a)*r*0.9);g.add(ch);
  }
  const spr=makeLabelSprite(String(n), boss?'#c0392b':'#d35400');
  spr.scale.set(1.3,0.65,1);spr.position.y=1.1;g.add(spr);
  if(boss){const crown=makeLabelSprite('👑',null,64,64);crown.scale.set(0.8,0.8,1);crown.position.y=1.5;g.add(crown);}
  return g;
}

/* 100-step finish staircase: every 5 people = 1 step, 5 coins per 5 steps (=1 coin/step) */
const STAIR_STEPS=100;
const PEOPLE_PER_STEP=5;
const COINS_PER_5_STEPS=5;
function makeStairs(){
  const g=new THREE.Group();
  // Thick solid steps — characters are snapped to top surface in code
  const stepH=0.35, stepD=0.85, stepW=ROAD_W-0.4;
  // Share materials every 5 steps for performance
  for(let i=0;i<STAIR_STEPS;i++){
    const t=i/STAIR_STEPS;
    const col=new THREE.Color().setHSL(0.13-t*0.08, 0.8, 0.5+t*0.15);
    const mat=new THREE.MeshStandardMaterial({color:col, roughness:0.5, metalness:0.12});
    const step=new THREE.Mesh(new THREE.BoxGeometry(stepW, stepH, stepD+0.05), mat);
    // Top of step i is at y = (i+1)*stepH
    step.position.set(0, stepH/2 + i*stepH, -i*stepD);
    step.receiveShadow=true;
    if(i%3===0) step.castShadow=true;
    g.add(step);
    if((i+1)%5===0){
      const spr=makeLabelSprite(String(i+1), 'rgba(20,30,50,0.85)', 64, 40);
      spr.scale.set(0.85,0.5,1);
      spr.position.set(0, (i+1)*stepH+0.3, -i*stepD);
      g.add(spr);
    }
  }
  const topH=stepH*STAIR_STEPS;
  const top=new THREE.Mesh(
    new THREE.BoxGeometry(stepW*0.7, 0.25, 2.2),
    new THREE.MeshStandardMaterial({color:0xfbbf24, metalness:0.35, roughness:0.35})
  );
  top.position.set(0, topH+0.12, -STAIR_STEPS*stepD-1);
  g.add(top);
  const flag=makeLabelSprite('🏁', null, 64, 64);
  flag.scale.set(1.3,1.3,1);
  flag.position.set(0, topH+1.3, -STAIR_STEPS*stepD-1);
  g.add(flag);
  g.userData.stepH=stepH; g.userData.stepD=stepD;
  return g;
}

/* ========== Level gen ========== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function apply(op,v,n){switch(op){case'+':return n+v;case'-':return Math.max(0,n-v);case'×':return n*v;case'÷':return Math.max(1,Math.ceil(n/v));}return n;}
function nice(v){return v>=60?Math.round(v/10)*10:v>=20?Math.round(v/5)*5:Math.max(1,v);}
// All difficulties completable; hard = more sections, slightly stronger enemies
const START_COUNT=[10,8,6],DIFF_MULT=[0.45,0.55,0.65];

function genLevel(lv){
  const rng=mulberry32(lv*7919+13+difficulty*97);
  const startN=START_COUNT[difficulty];let ideal=startN;
  // Enemy strength as fraction of current ideal — always beatable if player picks good gates
  const f=Math.min(0.40+lv*0.012,0.62)*DIFF_MULT[difficulty];
  const items=[];let d=28;
  const blocks=Math.min(2+Math.floor(lv*0.45)+difficulty,8);

  function opt(kind){
    if(kind==='mul')return{op:'×',v:rng()<0.7?2:3};
    if(kind==='add')return{op:'+',v:nice(Math.max(4,Math.round(ideal*(0.28+rng()*0.4))))};
    if(kind==='sub')return{op:'-',v:nice(Math.max(1,Math.round(ideal*(0.08+rng()*0.18))))};
    return{op:'÷',v:2};
  }
  // Always at least one clearly good option on a gate row
  const goodKinds=['add','add','mul'];
  const badKinds=['sub'];
  const pick=a=>a[Math.floor(rng()*a.length)];

  function gateRow(){
    let a=opt(pick(goodKinds)), b=opt(pick(badKinds));
    // 30% both sides ok (choice of two goods)
    if(rng()<0.3) b=opt(pick(goodKinds));
    if(rng()<0.5)[a,b]=[b,a];
    items.push({type:'gate',d,l:a,r:b,done:false});
    // ideal assumes player picks the better side
    ideal=Math.max(1,Math.max(apply(a.op,a.v,ideal),apply(b.op,b.v,ideal)));
    d+=20+Math.floor(rng()*4);
  }
  function enemyRow(boss){
    // Enemy always weaker than current ideal so a correct path wins
    const k=boss?Math.min(f+0.08,0.72):f;
    const n=Math.max(2,Math.round(ideal*k*(0.85+rng()*0.12)));
    items.push({type:'enemy',d,n,boss:!!boss,done:false});
    ideal=Math.max(startN, ideal-n+Math.round(ideal*0.15));
    d+=boss?24:20;
  }

  for(let i=0;i<blocks;i++){
    gateRow();
    if(rng()<0.5) gateRow();
    enemyRow(false);
  }
  gateRow();
  if(lv%5===0) enemyRow(true);

  // Stairs at end — road continues under them
  const stairsD=d+10;
  items.push({type:'stairs',d:stairsD,done:false,climbed:0});
  return{items,length:stairsD+Math.min(STAIR_STEPS,80)*0.85+12,startN};
}

function clearItems(){

function spawnItemMeshes(items){
  clearItems();
  for(const it of items){
    let mesh=null;
    if(it.type==='gate')mesh=makeGate(it.l,it.r);
    else if(it.type==='enemy')mesh=makeEnemyCrowd(it.n,it.boss);
    else if(it.type==='stairs')mesh=makeStairs();
    if(mesh){mesh.position.z=-it.d;itemGroup.add(mesh);meshMap.set(it,mesh);}
  }
}

/* ========== Update ========== */
function update(dt){
  time+=dt;
  let needUI=false;
  for(const k of Object.keys(powers)){if(powers[k]>0){powers[k]=Math.max(0,powers[k]-dt);needUI=true;}}
  if(needUI)updateBoosters();

  for(const[it,mesh]of meshMap){
    if(it.done)continue;
    if(mesh.userData.spin){
      if(mesh.userData.rotor)mesh.userData.rotor.rotation.z+=dt*10;
      else mesh.rotation.z+=dt*8;
    }
    if(mesh.userData.bob)mesh.position.y=0.15+Math.sin(time*4)*0.12;
    if(mesh.userData.ring){mesh.userData.ring.rotation.z+=dt*2;mesh.userData.ring.rotation.x=Math.PI/2+Math.sin(time*2)*0.2;}
    // Gate pulse glow
    if(mesh.userData.pulse && mesh.userData.panels){
      const p=0.35+Math.sin(time*3)*0.12;
      for(const panel of mesh.userData.panels){
        if(panel.material && panel.material.emissiveIntensity!==undefined)
          panel.material.emissiveIntensity=p;
        if(panel.material && panel.material.opacity!==undefined && panel.material.opacity<0.9)
          panel.material.opacity=0.45+Math.sin(time*3)*0.08;
      }
    }
  }
  updateAmbient(dt);

  if(!G||!player)return;
  if(st==='menu'||st==='pause'){
    if(st==='menu') camera.position.x=Math.sin(time*0.3)*0.5;
    return;
  }

  const dir=(keys['arrowright']||keys['d']?1:0)-(keys['arrowleft']||keys['a']?1:0);
  if(dir && st!=='stairs') player.targetX=Math.max(-ROAD_W/2+0.9,Math.min(ROAD_W/2-0.9,player.targetX+dir*8*dt));
  player.update(dt,time);
  if(battleEnemyCrowd) battleEnemyCrowd.update(dt,time);
  if(st==='play'||st==='battle'||st==='stairs') updateCountLabel();

  if(st==='play'){
    G.trav+=curSpeed()*dt;
    world.position.z=G.trav;
    // Soft footstep rhythm
    footAcc+=dt;
    if(footAcc>0.18){footAcc=0;sFoot();}

    for(const [it, mesh] of meshMap){
      if(!mesh) continue;
      mesh.position.z = G.trav - it.d;
      if(it.done && (G.trav - it.d) > 10) mesh.visible = false;
    }

    for(const it of G.items){
      if(it.done)continue;
      const dist=it.d-G.trav;

      if(it.type==='gate'&&dist<=0.5){
        it.done=true;
        const o=player.x<0?it.l:it.r;
        const before=G.n;
        G.n=Math.max(0,apply(o.op,o.v,G.n));
        player.setCount(G.n);
        updateCountLabel();
        sGate();
        (G.n>=before?sGood:sBad)();
        haptic(G.n>=before?'light':'medium');
        const delta=G.n-before;
        floatText((delta>=0?'+':'')+delta, delta>=0?'good':'bad');
        flashScreen(delta>=0?'#7dd3fc':'#fca5a5', 60);
        addShake(0.08);
        const m=meshMap.get(it);
        if(m){m.userData.pulse=false;m.traverse(c=>{if(c.material&&c.material.opacity!==undefined){c.material=c.material.clone();c.material.transparent=true;c.material.opacity=0.15;if(c.material.emissiveIntensity!==undefined)c.material.emissiveIntensity=0;}});}
        if(G.n<=0){doLose('Все челики пропали в воротах.');return;}
      }
      else if(it.type==='enemy'&&dist<=3.5){
        it.done=true;
        // Hide static mesh, create live enemy crowd for 1-on-1 fight
        const m=meshMap.get(it);
        if(m) m.visible=false;
        battleEnemyCrowd=new Crowd(false);
        battleEnemyCrowd.setCount(it.n, true);
        battleEnemyCrowd.group.position.set(0, 0, -2.5);
        battleEnemyCrowd.group.rotation.y=Math.PI; // face the player (+Z)
        battleEnemyCrowd.color=it.boss?0xc0392b:0xe67e22;
        battleEnemyCrowd.setColors(battleEnemyCrowd.color, battleEnemyCrowd.color);
        G.bat={it, pn:G.n, en:it.n, t:0, phase:0, acc:0};
        st='battle';
        break;
      }
      else if(it.type==='stairs'&&dist<=2.5){
        // Enter staircase finale
        it.done=true;
        st='stairs';
        G.stair={
          it, t:0,
          maxSteps: Math.min(STAIR_STEPS, Math.floor(G.n / PEOPLE_PER_STEP)),
          climbed:0,
          people:G.n
        };
        break;
      }
    }
  }
  else if(st==='battle'){
    const b=G.bat; b.t+=dt;
    // Keep enemy crowd in front of player
    if(battleEnemyCrowd){
      battleEnemyCrowd.group.position.z=THREE.MathUtils.lerp(battleEnemyCrowd.group.position.z, -1.8, dt*5);
      battleEnemyCrowd.group.position.x=THREE.MathUtils.lerp(battleEnemyCrowd.group.position.x, player.x*0.3, dt*3);
    }

    if(b.phase===0){
      // Approach
      if(b.t>=0.35){ b.phase=1; b.acc=0; }
    } else if(b.phase===1){
      // Realistic 1v1: each tick one character from EACH side collides and falls.
      // The larger crowd keeps surplus survivors — weaker disappears one-by-one faster in feel
      // because when sizes differ, we still do equal trades until smaller is gone.
      b.acc+=dt;
      const tickRate=Math.max(0.04, 0.07 - Math.min(b.pn,b.en)*0.0004);
      while(b.acc>=tickRate && b.pn>0 && b.en>0){
        b.acc-=tickRate;
        b.pn-=1; b.en-=1;
        sHit();
        addShake(0.06);
        player.setCount(b.pn);
        if(battleEnemyCrowd) battleEnemyCrowd.setCount(b.en);
        const cx=player.x*0.4;
        spawnSplat(cx+(Math.random()-0.5)*0.6, 0.25, -0.9, 0x3b9eff, 4);
        spawnSplat(cx+(Math.random()-0.5)*0.6, 0.25, -1.6, 0xe67e22, 4);
      }
      G.n=b.pn;
      updateCountLabel();
      if(b.pn<=0 || b.en<=0){ b.phase=2; b.t=0; haptic('heavy'); }
    } else {
      // Resolve after brief pause
      if(b.t>=0.45){
        if(b.pn>0 && b.en<=0){
          G.n=b.pn;
          player.setCount(b.pn);
          // small reward for winning fight
          const bonus=Math.round(2+b.it.n*0.15);
          coins+=bonus; save('coins',coins); updateHud();
          if(battleEnemyCrowd){
            spawnSplat(battleEnemyCrowd.group.position.x, 0.2, battleEnemyCrowd.group.position.z, 0xe67e22, 14);
            battleEnemyCrowd.dispose(); battleEnemyCrowd=null;
          }
          G.bat=null; st='play'; sGood();
        } else {
          G.n=0; player.setCount(0);
          spawnSplat(player.x, 0.2, 0, 0x3b9eff, 18);
          if(battleEnemyCrowd){ battleEnemyCrowd.dispose(); battleEnemyCrowd=null; }
          doLose(b.pn===0&&b.en===0 ? 'Силы равны — нужен перевес!' : 'Врагов оказалось больше.');
        }
      }
    }
  }
  else if(st==='stairs'){
    // Челики step up the stairs one by one — feet on step surface
    const s=G.stair;
    s.t+=dt;
    const stepH=0.35, stepD=0.85;
    // Climb rate: ~12 steps/sec feel
    const stepsPerSec=10;
    const targetStep=Math.min(s.maxSteps, Math.floor(s.t*stepsPerSec));
    if(targetStep > s.climbed){
      s.climbed=targetStep;
      sStep();
      if(s.climbed>0 && s.climbed%5===0){
        sCoin();
        floatText('🪙 +'+COINS_PER_5_STEPS,'coin');
      }
      haptic('light');
    }
    // Keep world scrolling so stairs stay under the crowd
    const desiredTrav=s.it.d + s.climbed*stepD;
    G.trav+=(desiredTrav-G.trav)*Math.min(1,dt*8);
    world.position.z=G.trav;
    for(const [it, mesh] of meshMap){
      if(mesh) mesh.position.z = G.trav - it.d;
    }
    // Snap Y to top of current step (solid contact)
    const y=s.climbed*stepH;
    player.group.position.y+=(y-player.group.position.y)*Math.min(1,dt*12);
    player.group.position.x+=(0-player.group.position.x)*dt*4;
    player.x+=(0-player.x)*dt*4;
    if(s.maxSteps<=0 && s.t>0.5){ doWin(0, s.people); }
    else if(s.climbed>=s.maxSteps && s.t>s.maxSteps/stepsPerSec+0.45){
      doWin(s.maxSteps, s.people);
    }
  }

  updateSplat(dt);

  // Camera follow
  const camTargetX=player.x*0.25;
  camera.position.x+=(camTargetX-camera.position.x)*dt*3.5;
  const camY = st==='stairs' ? (10.5 + player.group.position.y*0.55) : 10.5;
  camera.position.y+=(camY-camera.position.y)*dt*3;
  camera.position.z=13;
  camera.lookAt(player.x*0.1, 0.3+player.group.position.y*0.4, -6);
  updateHud();
}

/* ========== Resize & Loop ========== */
function resize(){const w=app.clientWidth,h=app.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();

buildEnvironment(biomeForLevel(level));
player=new Crowd(true);player.setCount(8, true);

let last=performance.now();
function frame(now){const dt=Math.min(0.033,(now-last)/1000);last=now;update(dt);renderer.render(scene,camera);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
document.addEventListener('visibilitychange',()=>{last=performance.now();});
</script>
</body>
